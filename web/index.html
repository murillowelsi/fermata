<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fermata</title>
<link rel="icon" href="icon.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F2F2F0; }
  @media (prefers-color-scheme: dark) { html, body { background: #29292B; } #loading { color: #ABABB0; } }
  #fermata_canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font: 14px -apple-system, "Segoe UI", sans-serif; color: #5C5C60; }
</style>
</head>
<body>
<canvas id="fermata_canvas"></canvas>
<div id="loading">Loading Fermata…</div>
<script type="module">
  // relative paths: works from the site root or a subfolder such as /fermata/app/
  import init from "./fermata.js";
  init({ module_or_path: new URL("./fermata_bg.wasm", import.meta.url) });
</script>
</body>
</html>
